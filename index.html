<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>for you princess</title>
<style>
/* Layout: one-screen portrait scene on black, tall brown vase at the bottom, bouquet rising from its mouth */
:root{--bg:#000;color-scheme:dark}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);-webkit-tap-highlight-color:transparent;user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
/* small paper note that unfolds when a hidden tag is tapped */
.card{position:absolute;left:0;top:0;padding:10px 16px 12px;min-width:92px;text-align:center;
  background:#f4e8d2;color:#5a2e1c;border-radius:3px;font:700 24px/1.05 "Caveat","Segoe Print","Bradley Hand",cursive;
  box-shadow:0 6px 18px rgba(0,0,0,.55);transform-origin:50% 0;pointer-events:none;
  transform:translate(-50%,0) scaleY(0) rotate(var(--r,0deg));opacity:0;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .25s}
.card::before{content:"";position:absolute;left:50%;top:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#000;opacity:.55}
.card::after{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:1px solid rgba(90,46,28,.12)}
.card.open{transform:translate(-50%,0) scaleY(1) rotate(var(--r,0deg));opacity:1}
.card span{display:block;padding-top:6px;position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.card{transition:opacity .2s}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap">
</head><body>
<canvas id="c" aria-label="Un vaso: toccalo per far sbocciare i fiori" role="img"></canvas>
<div class="card" id="card" aria-live="polite"><span id="cardText"></span></div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const GROW=reduce?200:1100, BLOOM=reduce?200:850;
let stars=[],W=0,H=0,col=0,vase={},flowers=[],parts=[],started=0,doneAt=0,wobble=0,lastPetal=0;

function resize(){
  const d=Math.min(devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  col=Math.min(W,H*0.6);                 // portrait column, also on wide screens
  vase.w=col*0.3;vase.h=Math.min(vase.w*2,H*0.34);
  vase.x=W/2;vase.y=H-vase.h-H*0.02;
  makeStars();
  vase.lip=vase.w*0.3;
}
addEventListener('resize',resize);resize();

function rnd(a,b){return a+Math.random()*(b-a);}
function makeStars(){
  const n=Math.round(W*H*.4/2600);
  stars=[...Array(n)].map(()=>{
    const y=Math.pow(Math.random(),1.6)*H*.42;           // denser near the top
    return{x:Math.random()*W,y,r:Math.random()<.12?rnd(1,1.4):rnd(.35,.8),ph:rnd(0,6.3),sp:rnd(.0006,.0018),fade:1-y/(H*.42)};
  });
}
function drawStars(now){
  for(const s of stars){
    const tw=reduce?.8:.55+.45*Math.sin(now*s.sp+s.ph);
    ctx.globalAlpha=Math.max(0,tw)*(.35+.65*s.fade);
    ctx.fillStyle='#fff6e0';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
    if(s.r>1){ctx.globalAlpha*=.5;ctx.fillRect(s.x-s.r*3,s.y-.25,s.r*6,.5);ctx.fillRect(s.x-.25,s.y-s.r*3,.5,s.r*6);}
  }
  ctx.globalAlpha=1;
}
const TULIP=[['#ef4d63','#b5223b'],['#f58c3d','#c4561a'],['#f26fa3','#bf3c74'],['#f5d24c','#cf9a17'],['#c36bd6','#8a3aa3']];
const LILY=[['#ffffff','#f28fb4','#c2306b'],['#fffaf2','#f7b26b','#d0641c'],['#ffffff','#f7c6dd','#d24c86']];

function makeFlowers(){
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
  // 4 sunflowers, 6 lilies, 6 tulips
  const pool=shuffle([...Array(4).fill('sun'),...Array(6).fill('lily'),...Array(6).fill('tulip')]);
  const N=pool.length,order=shuffle([...Array(N).keys()]);
  // heights spread evenly from low to high, then mixed, so every flower has its own level
  const levels=shuffle([...Array(N-4).keys()].map(k=>.04+k*(.8/(N-5))));
  flowers=pool.map((type,i)=>{
    const f=i/(N-1),ang=(-1+2*f)*.6+rnd(-.05,.05);
    const len=type==='sun'?rnd(.78,1):levels.pop()+rnd(-.03,.03);
    const nl=type==='sun'?3:2+(Math.random()<.5?1:0);
    const side0=Math.random()<.5?-1:1;
    const leaves=[...Array(nl)].map((_,k)=>({t:.22+k*(.5/nl)+rnd(-.04,.04),side:k%2?-side0:side0,s:rnd(.75,1.1)}));
    return{type,ang,len,leaves,
      size:type==='sun'?rnd(.16,.18):type==='lily'?rnd(.16,.19):rnd(.13,.15),
      base:rnd(-.35,.35),ph:rnd(0,6.3),
      delay:order[i]*(reduce?20:150),
      tul:TULIP[Math.random()*TULIP.length|0],lil:LILY[Math.random()*LILY.length|0]};
  }).sort((a,b)=>(a.type==='sun'?0:1)-(b.type==='sun'?0:1)||b.len-a.len);  // sunflowers drawn at the back
  // four flowers hide a small note: two per side, at different heights so the tags never touch
  const notes=shuffle(['miss you','be happy!','big hug for you','smile princess']);
  for(const side of[-1,1]){
    let c=flowers.filter(f=>f.type!=='sun'&&Math.sign(f.ang)===side&&f.len>.2&&f.len<.85).sort((x,y)=>x.len-y.len);
    if(c.length<2)c=flowers.filter(f=>f.type!=='sun'&&Math.sign(f.ang)===side).sort((x,y)=>x.len-y.len);
    for(const f of[c[0],c[c.length-1]])if(f&&!f.note&&notes.length)f.note=notes.pop();
  }
  while(notes.length){const f=flowers.find(f=>f.type!=='sun'&&!f.note);if(!f)break;f.note=notes.pop();}
}

const easeOut=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const clamp=x=>Math.max(0,Math.min(1,x));

function geom(f,now){
  const top=vase.y,sz=f.size*col*.5;
  const minUp=sz*1.4,Ry=top-H*0.15-sz,Rx=col*.46;
  const bx=vase.x+f.base*vase.lip,by=top+vase.h*.25;
  let hx=vase.x+Math.sin(f.ang)*Rx,hy=top-minUp-(Ry-minUp)*f.len;
  const t=started?now-started-f.delay:-1;
  const p=easeOut(clamp(t/GROW)),b=clamp((t-GROW*0.85)/BLOOM);
  if(!reduce)hx+=Math.sin(now*.0011+f.ph)*sz*.12*b;
  // control point straight above the mouth: every stem leaves the vase vertically
  const cx=bx+(hx-bx)*.12,cy=top-(top-hy)*.55;
  return{bx,by,hx,hy,cx,cy,p,b:b>0?back(b):0,sz};
}
const qpt=(g,t)=>{const u=1-t;return[u*u*g.bx+2*u*t*g.cx+t*t*g.hx,u*u*g.by+2*u*t*g.cy+t*t*g.hy];};
const qtan=(g,t)=>[2*(1-t)*(g.cx-g.bx)+2*t*(g.hx-g.cx),2*(1-t)*(g.cy-g.by)+2*t*(g.hy-g.cy)];

function drawStem(f,g){
  if(g.p<=0)return;
  ctx.strokeStyle='#3f8a4c';ctx.lineWidth=Math.max(2.5,g.sz*.07);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(g.bx,g.by);
  for(let i=1;i<=28;i++){const[x,y]=qpt(g,g.p*i/28);ctx.lineTo(x,y);}
  ctx.stroke();
  for(const lf of f.leaves){
    const t=lf.t+.1;
    if(g.p<=t)continue;
    const[x,y]=qpt(g,t);
    if(y>vase.y-4)continue;                 // never inside the vase
    const k=clamp((g.p-t)/.25),[dx,dy]=qtan(g,t);
    const a=Math.atan2(dy,dx)+lf.side*.75,L=g.sz*(f.type==='tulip'?1.05:.85)*lf.s*k;
    const wd=f.type==='lily'?.22:.32;
    ctx.save();ctx.translate(x,y);ctx.rotate(a);
    ctx.fillStyle=f.type==='sun'?'#4a9550':'#55a35c';ctx.beginPath();ctx.moveTo(0,0);
    ctx.quadraticCurveTo(L*.5,-L*wd,L,0);ctx.quadraticCurveTo(L*.5,L*wd,0,0);ctx.fill();
    ctx.strokeStyle='rgba(20,60,30,.45)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(L*.85,0);ctx.stroke();
    ctx.restore();
  }
}

function sunflower(r){
  for(let layer=0;layer<2;layer++){
    const n=18,off=layer?Math.PI/n:0;
    ctx.fillStyle=layer?'#f9c22e':'#e9a114';
    for(let i=0;i<n;i++){
      ctx.save();ctx.rotate(off+i*2*Math.PI/n);
      ctx.beginPath();ctx.ellipse(0,-r*(layer?.72:.78),r*.15,r*(layer?.36:.4),0,0,7);ctx.fill();ctx.restore();
    }
  }
  const g=ctx.createRadialGradient(0,0,0,0,0,r*.44);g.addColorStop(0,'#6b3a17');g.addColorStop(1,'#3b1e0b');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*.44,0,7);ctx.fill();
  ctx.fillStyle='rgba(240,190,90,.55)';
  for(let i=0;i<70;i++){const a=i*2.39996,d=Math.sqrt(i/70)*r*.4;ctx.beginPath();ctx.arc(Math.cos(a)*d,Math.sin(a)*d,r*.022,0,7);ctx.fill();}
}
function lily(r,c){
  for(let layer=0;layer<2;layer++){
    for(let i=0;i<3;i++){
      ctx.save();ctx.rotate(i*2*Math.PI/3+(layer?Math.PI/3:0));
      const L=r*(layer?.95:1.05);
      const g=ctx.createLinearGradient(0,0,0,-L);g.addColorStop(0,c[1]);g.addColorStop(.75,c[0]);
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);
      ctx.bezierCurveTo(L*.38,-L*.3,L*.24,-L*.78,0,-L);ctx.bezierCurveTo(-L*.24,-L*.78,-L*.38,-L*.3,0,0);ctx.fill();
      ctx.strokeStyle=c[2];ctx.globalAlpha=.35;ctx.lineWidth=Math.max(1,r*.025);
      ctx.beginPath();ctx.moveTo(0,-L*.1);ctx.lineTo(0,-L*.7);ctx.stroke();ctx.globalAlpha=1;
      ctx.fillStyle=c[2];
      for(let k=0;k<4;k++){ctx.beginPath();ctx.arc((k%2?1:-1)*L*.07,-L*(.2+k*.08),r*.02,0,7);ctx.fill();}
      ctx.restore();
    }
  }
  for(let i=0;i<6;i++){
    ctx.save();ctx.rotate(i*Math.PI/3+.3);
    ctx.strokeStyle='#cfd98a';ctx.lineWidth=Math.max(1,r*.025);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-r*.5);ctx.stroke();
    ctx.fillStyle='#b5531b';ctx.beginPath();ctx.ellipse(0,-r*.52,r*.035,r*.075,0,0,7);ctx.fill();
    ctx.restore();
  }
}
function tulip(r,c){
  ctx.fillStyle=c[1];ctx.beginPath();ctx.ellipse(0,-r*.62,r*.42,r*.62,0,0,7);ctx.fill();
  ctx.fillStyle=c[0];
  for(const s of[-1,1]){
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(s*r*.72,-r*.08,s*r*.78,-r*1,s*r*.28,-r*1.26);
    ctx.quadraticCurveTo(s*r*.05,-r*.7,0,0);ctx.fill();
  }
  const g=ctx.createLinearGradient(0,0,0,-r*1.15);g.addColorStop(0,c[1]);g.addColorStop(1,c[0]);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(-r*.48,-r*.2,-r*.42,-r*.95,0,-r*1.15);ctx.bezierCurveTo(r*.42,-r*.95,r*.48,-r*.2,0,0);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=Math.max(1,r*.04);
  ctx.beginPath();ctx.moveTo(-r*.1,-r*.25);ctx.quadraticCurveTo(-r*.2,-r*.65,-r*.05,-r*.95);ctx.stroke();
}
function drawHead(f,g){
  if(g.b<=0)return;
  const[dx,dy]=qtan(g,1);
  ctx.save();ctx.translate(g.hx,g.hy);
  ctx.rotate((Math.atan2(dy,dx)+Math.PI/2)*(f.type==='tulip'?1:.35));
  ctx.scale(g.b,g.b);
  if(f.type==='sun')sunflower(g.sz);
  else if(f.type==='lily')lily(g.sz,f.lil);
  else tulip(g.sz*1.1,f.tul);
  ctx.restore();
}

// little paper tag tied just under the flower head, half hidden by the petals
function tagGeom(f,g,now){
  const[ax,ay]=qpt(g,.9),side=f.ang<0?-1:1;
  const wig=reduce?0:Math.sin(now*.0016+f.ph)*.08+(Math.sin(now*.0007+f.ph)>.97?Math.sin(now*.03)*.12:0);
  return{ax,ay,side,x:ax+side*g.sz*.95,y:ay+g.sz*.5,w:g.sz*.62,h:g.sz*.42,rot:side*.18+wig};
}
function drawTag(f,g,now){
  if(!f.note||g.b<=0)return;
  const t=tagGeom(f,g,now),k=Math.min(1,g.b);
  ctx.save();ctx.globalAlpha=k;
  ctx.strokeStyle='rgba(235,220,190,.7)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(t.ax,t.ay);ctx.lineTo(t.x-t.side*t.w*.38,t.y-t.h*.4);ctx.stroke();
  ctx.translate(t.x,t.y);ctx.rotate(t.rot);ctx.scale(k,k);
  ctx.fillStyle='#efe1c6';ctx.fillRect(-t.w/2,-t.h/2,t.w,t.h);
  ctx.fillStyle='rgba(120,70,40,.25)';ctx.fillRect(-t.w/2,-t.h/2,t.w,t.h*.18);
  ctx.strokeStyle='rgba(120,70,40,.35)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(-t.w*.3,t.h*.1);ctx.lineTo(t.w*.3,t.h*.1);ctx.stroke();
  ctx.restore();
}

// tall, plain vase: narrow neck, soft shoulder, slight taper to the foot
function vasePath(x,y,w,h){
  const lip=w*.3,neck=w*.24,foot=w*.34;
  ctx.beginPath();ctx.moveTo(x-lip,y);ctx.lineTo(x+lip,y);
  ctx.quadraticCurveTo(x+neck,y+h*.05,x+neck,y+h*.12);
  ctx.bezierCurveTo(x+neck,y+h*.24,x+w*.5,y+h*.26,x+w*.5,y+h*.42);
  ctx.bezierCurveTo(x+w*.5,y+h*.7,x+foot,y+h*.9,x+foot,y+h);
  ctx.lineTo(x-foot,y+h);
  ctx.bezierCurveTo(x-foot,y+h*.9,x-w*.5,y+h*.7,x-w*.5,y+h*.42);
  ctx.bezierCurveTo(x-w*.5,y+h*.26,x-neck,y+h*.24,x-neck,y+h*.12);
  ctx.quadraticCurveTo(x-neck,y+h*.05,x-lip,y);ctx.closePath();
}
function drawVaseBody(now){
  const{x,y,w,h}=vase;
  const a=wobble*Math.sin(now*.03);
  ctx.save();ctx.translate(x,y+h);ctx.rotate(a);ctx.translate(-x,-(y+h));
  vasePath(x,y,w,h);
  const g=ctx.createLinearGradient(x-w*.5,0,x+w*.5,0);
  g.addColorStop(0,'#2a180c');g.addColorStop(.32,'#6a4428');g.addColorStop(.62,'#4a2e1a');g.addColorStop(1,'#1c0f07');
  ctx.fillStyle=g;ctx.fill();
  // decorations: gold bands, a vine with leaves around the belly, a small heart in the middle
  ctx.save();ctx.clip();
  const gold='#d9b26a',lw=Math.max(1.2,w*.014);
  ctx.strokeStyle=gold;ctx.fillStyle=gold;ctx.lineWidth=lw;
  for(const[yy,ww] of[[y+h*.17,1],[y+h*.21,.6],[y+h*.88,1],[y+h*.92,.6]]){
    ctx.globalAlpha=ww;ctx.beginPath();ctx.moveTo(x-w*.6,yy);ctx.lineTo(x+w*.6,yy);ctx.stroke();
  }
  ctx.globalAlpha=1;
  const vy=y+h*.55,amp=h*.06;
  ctx.beginPath();
  for(let i=0;i<=60;i++){const px=x-w*.55+i*(w*1.1/60);const py=vy+Math.sin((px-x)/w*9)*amp;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
  ctx.stroke();
  for(let i=-5;i<=5;i++){
    if(i===0)continue;
    const px=x+i*w*.1,py=vy+Math.sin(i*.9)*amp,up=i%2?-1:1,L=w*.075;
    ctx.save();ctx.translate(px,py);ctx.rotate(up*(Math.PI/2.6));
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(L*.5,-L*.35,L,0);ctx.quadraticCurveTo(L*.5,L*.35,0,0);ctx.fill();
    ctx.restore();
  }
  for(let i=-4;i<=4;i++){ctx.beginPath();ctx.arc(x+i*w*.12,y+h*.76,w*.012,0,7);ctx.fill();}
  const hs=w*.11;
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x,vy,hs*1.05,0,7);ctx.globalAlpha=.25;ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle=gold;heart(x,vy+hs*.2,hs*.85);
  ctx.fillStyle='rgba(255,230,190,.08)';
  ctx.beginPath();ctx.ellipse(x-w*.22,y+h*.5,w*.05,h*.25,-.05,0,7);ctx.fill();
  ctx.restore();
  ctx.strokeStyle=gold;ctx.lineWidth=Math.max(1.5,w*.02);
  ctx.beginPath();ctx.ellipse(x,y,vase.lip,w*.05,0,0,Math.PI);ctx.stroke();
  ctx.restore();
}
function drawVaseMouth(){
  const{x,y,w}=vase;
  ctx.fillStyle='#0d0703';ctx.beginPath();ctx.ellipse(x,y,vase.lip,w*.05,0,0,7);ctx.fill();
}

function heart(x,y,s){
  ctx.beginPath();ctx.moveTo(x,y+s*.35);
  ctx.bezierCurveTo(x-s*.9,y-s*.3,x-s*.4,y-s,x,y-s*.45);
  ctx.bezierCurveTo(x+s*.4,y-s,x+s*.9,y-s*.3,x,y+s*.35);ctx.fill();
}
function burst(px,py){
  for(let i=0;i<14;i++)parts.push({kind:'heart',x:px,y:py,vx:rnd(-1.4,1.4),vy:rnd(-3.2,-1.2),s:rnd(7,14),life:1,c:['#ef4d63','#f26fa3','#f5d24c','#ffffff'][i%4]});
}
function dropPetal(now){
  const f=flowers[Math.random()*flowers.length|0],g=geom(f,now);
  const c=f.type==='sun'?'#f9c22e':f.type==='lily'?f.lil[1]:f.tul[0];
  parts.push({kind:'petal',x:g.hx,y:g.hy,vx:rnd(-.4,.4),vy:rnd(.3,.7),s:g.sz*.22,life:1,c,rot:rnd(0,6),vr:rnd(-.04,.04)});
}

function frame(now){
  ctx.clearRect(0,0,W,H);
  drawStars(now);
  drawVaseMouth();
  const gs=flowers.map(f=>geom(f,now));
  flowers.forEach((f,i)=>drawStem(f,gs[i]));
  flowers.forEach((f,i)=>drawHead(f,gs[i]));
  flowers.forEach((f,i)=>drawTag(f,gs[i],now));   // on top, so no other flower can hide a note
  drawVaseBody(now);
  wobble*=.94;

  if(started&&!doneAt&&gs.every(g=>g.b>=1))doneAt=now;
  if(doneAt&&!reduce&&now-lastPetal>1300){lastPetal=now;dropPetal(now);}

  parts=parts.filter(p=>p.life>0&&p.y<H+40);
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    if(p.kind==='heart'){p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life-=.012;heart(p.x,p.y,p.s);}
    else{p.x+=p.vx+Math.sin(now*.002+p.rot)*.4;p.y+=p.vy;p.rot+=p.vr;p.life-=.0025;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.ellipse(0,0,p.s*.45,p.s,0,0,7);ctx.fill();ctx.restore();}
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}

const card=document.getElementById('card'),cardText=document.getElementById('cardText');
let cardOpen=false;
function openCard(f,t){
  cardText.textContent=f.note;
  const x=Math.max(70,Math.min(W-70,t.x)),y=Math.min(H-90,t.y+t.h);
  card.style.left=x+'px';card.style.top=y+'px';
  card.style.setProperty('--r',(t.side*rnd(2,5)).toFixed(1)+'deg');
  card.classList.add('open');cardOpen=true;
}
function closeCard(){card.classList.remove('open');cardOpen=false;}
function hitNote(px,py,now){
  for(const f of flowers){
    if(!f.note)continue;
    const g=geom(f,now);if(g.b<.9)continue;
    const t=tagGeom(f,g,now),rt=Math.max(22,g.sz*.6);
    if(Math.hypot(px-t.x,py-t.y)<rt)return[f,t];
  }
  return null;
}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,now=performance.now();
  if(!started){makeFlowers();started=now;wobble=reduce?0:.06;return;}
  if(cardOpen){closeCard();return;}
  const hit=hitNote(px,py,now);
  if(hit){openCard(hit[0],hit[1]);return;}
  wobble=reduce?0:.04;
  if(doneAt)burst(px,py);
});
requestAnimationFrame(frame);
})();
